spring:
  application:
    name: nowaito-backend

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

nowaito:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 1440

  zone:
    min-drivers-to-launch: 20
    health-floor: 10

  cancellation:
    free-window-minutes: 3
    fee-rupees: 40
    driver-share-rupees: 25

  pricing:
    guarantee-fee:
      BIKE: 5
      AUTO: 7
      CAR: 9

  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}

springdoc:
  swagger-ui:
    path: /docs

---
# ============================================================
# FREE CLOUD PROFILE
# Render + Supabase PostgreSQL + Upstash Redis
# Activate using:
# SPRING_PROFILES_ACTIVE=free-cloud
# ============================================================

spring:
  config:
    activate:
      on-profile: free-cloud

  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  data:
    redis:
      host: ${UPSTASH_REDIS_HOST}
      port: ${UPSTASH_REDIS_PORT:6379}
      password: ${UPSTASH_REDIS_PASSWORD}

      ssl:
        enabled: true

---
# ============================================================
# TEST PROFILE
# ============================================================

spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:nowaito;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop