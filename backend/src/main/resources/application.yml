spring:
  application:
    name: nowaito-backend
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

nowaito:
  jwt:
    secret: ${JWT_SECRET:nowaito-dev-secret-change-this-in-production-please-0001}
    expiry-minutes: 1440
  zone:
    min-drivers-to-launch: 20
    health-floor: 10
  cancellation:
    free-window-minutes: 3
    fee-rupees: 40
    driver-share-rupees: 25
  pricing:
    guarantee-fee:
      BIKE: 5
      AUTO: 7
      CAR: 9
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}

springdoc:
  swagger-ui:
    path: /docs

