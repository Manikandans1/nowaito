name: nowaito
description: NoWaito — Ride Guaranteed. Zone-based ride-hailing platform for Bangalore and Chennai.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3
  go_router: ^13.2.4
  provider: ^6.1.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  flutter_local_notifications: ^17.2.2   # in-app notifications
  url_launcher: ^6.3.0                   # SOS phone call + share trip link

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
