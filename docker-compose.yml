version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nowaito-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nowaito
      POSTGRES_USER: nowaito
      POSTGRES_PASSWORD: nowaito
    ports:
      - "5432:5432"
    volumes:
      - nowaito_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nowaito-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  nowaito_pg_data:
